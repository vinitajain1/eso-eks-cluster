apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-app
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: demo-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GREETING
      remoteRef:
        key: CHANGEME
        property: GREETING
    - secretKey: API_TOKEN
      remoteRef:
        key: CHANGEMEORELSE
        property: API_TOKEN