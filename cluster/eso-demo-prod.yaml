apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: eso-demo-prod
  region: us-east-2
  version: "1.36"
  tags:
    project: eso-demo
    env: prod
iam:
  withOIDC: true
vpc:
  nat:
    gateway: Disable
managedNodeGroups:
  - name: general
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    labels:
      nodegroup: general