apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-app

resources:
- ../base
- external-secret-private.yaml

patches:
  - patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: demo-app
      spec:
        data:
          - secretKey: GREETING
            remoteRef:
              key: eso-demo-prod/demo-app/config
              property: GREETING
          - secretKey: API_TOKEN
            remoteRef:
              key: eso-demo-prod/demo-app/config
              property: API_TOKEN