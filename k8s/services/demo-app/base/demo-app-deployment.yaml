apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app.kubernetes.io/name: demo-app
  annotations:
    # Used only if Reloader is installed (step 11): restart pods when Secret demo-app changes.
    secret.reloader.stakater.com/reload: "demo-app"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
    spec:
      serviceAccountName: demo-app
      automountServiceAccountToken: false      # the app never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: busybox:1.37.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date -u +%H:%M:%S)  env GREETING=${GREETING}  |  file GREETING=$(cat /etc/demo-app/GREETING)"
                sleep 10
              done
          env:
            # Read once at container start; does NOT change when the Secret changes.
            - name: GREETING
              valueFrom:
                secretKeyRef:
                  name: demo-app          # Secret created by the ExternalSecret
                  key: GREETING
          volumeMounts:
            # Updated in place by the kubelet when the Secret changes (no subPath!).
            - name: demo-app-secret
              mountPath: /etc/demo-app
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: demo-app-secret
          secret:
            secretName: demo-app